name: Deploy Databricks Bundle

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: ./lakewatch

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # Bundle variables
      BUNDLE_VAR_warehouse_id: ${{ secrets.WAREHOUSE_ID }}

      # dbt profile env vars
      WAREHOUSE_HTTP_PATH: ${{ secrets.WAREHOUSE_HTTP_PATH }}

    steps:
      - uses: actions/checkout@v4
      - name: Install Databricks CLI
        run: |
          echo "🚀 Installing Databricks CLI"
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - name: Validate bundle
        run: databricks bundle validate --target dev
      - name: Deploy bundle
        run: |
          echo "🚀 Deploying Databricks Bundle to Dev"
          echo "Using Databricks Host: $DATABRICKS_HOST"
          echo "Using Warehouse HTTP Path: $WAREHOUSE_HTTP_PATH"
          databricks bundle deploy --target dev --force
  
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev  # <--- THIS ENSURES DEV MUST SUCCEED FIRST
    
    # Only run Prod if it was a manual trigger (workflow_dispatch)
    if: github.event_name == 'workflow_dispatch'
    
    defaults:
      run:
        working-directory: ./lakewatch
    env:
      DATABRICKS_HOST: ${{ secrets.PROD_DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
      BUNDLE_VAR_warehouse_id: ${{ secrets.PROD_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - name: Deploy to Prod
        run: databricks bundle deploy --target prod --force
