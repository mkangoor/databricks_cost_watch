# This file defines prompts with defaults for dbt initializaton.
# It is used when the `dbt init` command is invoked.
#
fixed:
  type: databricks
prompts:
  host:
    default: "{{ env_var('DATABRICKS_HOST') }}"
  token:
    hint: 'personal access token to use, dapiXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
    default: "{{ env_var('DATABRICKS_TOKEN') }}"
  http_path:
    hint: 'HTTP path of SQL warehouse to use'
    default: "{{ env_var('WAREHOUSE_HTTP_PATH') }}"
  catalog:
    hint: 'initial catalog'
    default: lakewatch
  schema:
    hint: 'personal schema where dbt will build objects during development, example: tsuman_maks'
    default: dev
  threads:
    hint: 'threads to use during development, 1 or more'
    type: 'int'
    default: 4
  connect_timeout:
    hint: 'connection timeout in seconds'
    type: 'int'
    default: 30
