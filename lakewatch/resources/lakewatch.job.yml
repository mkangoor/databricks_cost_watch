resources:
  jobs:
    lakewatch_job:
      name: lakewatch_job
      tags:
        Pipeline: lakewatch
      schedule:
        quartz_cron_expression: 12 0 5 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: lakewatch-cost-job
          max_retries: 2
          dbt_task:
            project_directory: ${workspace.root_path}/files/
            profiles_directory: ./dbt_profiles
            commands:
            - dbt deps --target=${bundle.target}
            - dbt run --select stg_usage --full-refresh
            - dbt run
            warehouse_id: ${var.warehouse_id} 
            catalog: ${var.catalog}
            schema: ${bundle.target}
            source: WORKSPACE
          environment_key: dbt-default
      queue:
        enabled: true
      environments:
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED