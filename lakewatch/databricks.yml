# This file defines the structure of this project and how it is deployed
# to production using Databricks Asset Bundles.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lakewatch
  uuid: 9f54d217-b861-4c67-bf99-5d8fe2abd253

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: The id of the warehouse to use
    default: 16643be376353b2c
  asset_suffix:
    description: The suffix to use for the assets
  catalog:
    description: The target catalog

# Deployment targets.
# The default schema, catalog, etc. for dbt are defined in dbt_profiles/profiles.yml
targets:
  dev:
    default: true
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    workspace:
      host: https://dbc-84aff3a4-d679.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: ${workspace.current_user.userName}
    variables:
      asset_suffix: dev_${workspace.current_user.short_name}
      catalog: lakewatch

  prod:
    mode: production
    workspace:
      host: https://dbc-84aff3a4-d679.cloud.databricks.com
      # We explicitly specify /Workspace/Users/tsuman.maks@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
    run_as:
      user_name: ${workspace.current_user.userName}
    variables:
      asset_suffix: prod
      catalog: lakewatch
